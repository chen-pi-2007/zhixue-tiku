<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-label="智学题库使用情况">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
  .bg{fill:#ffffff;stroke:#d8dee4}
  .h{font-size:18px;font-weight:600;fill:#1f2328}
  .m{font-size:12px;fill:#656d76}
  .k{font-size:13px;fill:#656d76}
  .big{font-size:34px;font-weight:700;fill:#1f2328}
