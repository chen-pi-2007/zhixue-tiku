    .ln{stroke:#3987e5}.dot{fill:#3987e5;stroke:#0d1117}.accent{fill:#3987e5}
    .stop1{stop-color:#3987e5;stop-opacity:.30}.stop2{stop-color:#3987e5;stop-opacity:0}
  }
</style>
