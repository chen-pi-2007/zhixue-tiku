<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智学题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='10' fill='none' stroke='%23c4374a' stroke-width='10'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23c4374a' font-family='serif'%3E%E9%A2%98%3C/text%3E%3C/svg%3E">
<script>
/* 配色：light 浅色 / dark 深色；auto 跟随系统。放在 head 里避免闪白 */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('quiz.theme') || 'auto'; } catch (e) {}
  pref = { paper: 'light', ink: 'light', blue: 'light', green: 'light', orange: 'light', soft: 'light', eye: 'light', night: 'dark', board: 'dark' }[pref] || pref;   // 旧主题名
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', pref === 'auto' ? (dark ? 'dark' : 'light') : pref);
  document.documentElement.setAttribute('data-theme-pref', pref);
})();
/* 安卓 App 里（有 ZXStore）：先加载本地后端 local.js，再隐藏手机上用不了的入口（技能实操、导入试卷）。
   电脑和手机用同一份界面文件，热更新时两边一起更新 */
if (window.ZXStore) {
  document.documentElement.classList.add('app');
  document.write('<script src="local.js"><\/script>');
}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <a class="logo" href="#/home"><span class="seal">题</span><span class="logo-t">智学题库</span></a>
  <span class="top-sep"></span>
  <span class="top-sub">江苏中职学测</span>
  <div class="theme-pick">
    <button id="theme-btn" class="theme-btn" aria-haspopup="true" aria-expanded="false" title="切换浅色/深色">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div id="theme-menu" class="theme-menu" hidden>
      <button data-t="auto"><span class="sw sw-auto"></span>跟随系统</button>
      <button data-t="light"><span class="sw sw-light"></span>浅色</button>
      <button data-t="dark"><span class="sw sw-dark"></span>深色</button>
    </div>
  </div>
</header>
<div class="layout">
  <aside id="side">
    <nav id="nav">
      <a href="#/home" data-v="home"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>题库</a>
      <a href="#/wrong" data-v="wrong"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="m10 7 4 4m0-4-4 4"/></svg>错题本</a>
      <a href="#/exam" data-v="exam"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>模拟考试</a>
      <a href="#/skills" data-v="skills"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="m9 9 2 2 4-4"/></svg>技能实操</a>
      <a href="#/bank" data-v="bank"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>搜索题目</a>
      <a href="#/upload" data-v="upload"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>导入试卷</a>
      <a href="#/settings" data-v="settings" class="nav-bottom"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</a>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="app"></main>
</div>
<div id="toasts"></div>
<script src="app.js"></script>
<script src="skills.js"></script>
</body>
</html>
